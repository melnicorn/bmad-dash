# The epics of initiative-notes-app in build order. Table order is the build order; id is not.

[[epic]]
id = 1
slug = "epic-editor"
title = "Write, save and reopen a note"
covers = ["CAP-1"]

[[epic]]
id = 2
slug = "epic-sync"
title = "Sync notes between devices"
covers = ["CAP-2", "CAP-3"]
after = [{ epic = 1, needs = "the on-disk note format and the save path" }]
